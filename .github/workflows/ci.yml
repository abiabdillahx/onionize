name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck -S warning -s sh entrypoint.sh
          shellcheck -S warning -s bash run.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: onionize:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bad TARGET must fail
        run: |
          if docker run --rm -e TARGET=oops onionize:ci; then
            echo "expected failure"; exit 1
          fi

      - name: Smoke test (torrc generated, onion address appears)
        run: |
          docker run -d --name smoke -e TARGET=127.0.0.1:80 onionize:ci
          for _ in $(seq 1 60); do
            if docker logs smoke 2>&1 | grep -q "onion address:"; then
              docker logs smoke; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              docker logs smoke; exit 1
            fi
            sleep 2
          done
          docker logs smoke; exit 1
